name: dco

# This repository's enforcement of the Developer Certificate of Origin,
# delegating to the organisation's shared reusable workflow.
#
# "secrets: inherit" forwards GH_APP_SECURITY_PRIVATE_KEY, so the verdict is
# published as the security app's own check run. Without it the check still
# enforces through this job's own pass or fail status.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    # v0.1.1 - kept on its own line, not a trailing comment: inline it would push this
    # line past yamllint's 120-character line-length limit (the SHA alone is 40 characters).
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-dco.yaml@f64e9f521dd9d66f0233cd8e8035c778b9567f0c
    secrets: inherit
