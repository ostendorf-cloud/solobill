name: renovate

# This repository's own per-repository Renovate run, delegating to the
# organisation's shared reusable workflow. Runs self-hosted Renovate for this
# repository only, authenticated through the ostendorf-cloud-dependencies
# GitHub App.
#
# The "issues"/"pull_request_target" "edited" triggers exist so that a human
# checking a Renovate rebase checkbox reacts within this run's CI time,
# instead of waiting for the next "schedule" tick: checking that checkbox
# edits the Dependency Dashboard issue body or a Renovate pull request's own
# body, both reported as an "edited" event on the repository the checkbox
# lives in.
#
# Every trigger below calls "reusable-renovate.yaml" unconditionally. The
# anti-loop guard against Renovate's own edits re-triggering this workflow is
# centralized inside "reusable-renovate.yaml" itself, as its own job-level
# "if:", not duplicated here.
on:
  # Deliberately staggered from ostendorf-cloud/workflows's own dogfooding
  # cron (17 * * * *) and from other repositories' Renovate schedules in this
  # rollout.
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
  issues:
    types: [edited]
  # A pull request with a merge conflict starts no pull_request run, so a
  # rebase tick on it needs this trigger. It also covers clean pull requests.
  pull_request_target:
    types: [edited]
  # Renovate runs when the checks of a Renovate branch have finished. The
  # list names every workflow that runs checks on a pull request: a
  # workflow left out can leave a pending check, and Renovate then waits
  # for the next scheduled tick.
  workflow_run:
    workflows: [checks, codeql, dco]
    types: [completed]
    branches: ["renovate/**"]

permissions:
  contents: read

jobs:
  renovate:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate.yaml@v0
    secrets: inherit
