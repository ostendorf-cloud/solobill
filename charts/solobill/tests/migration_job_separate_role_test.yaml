suite: migration job requires a separate migration role
templates:
  - templates/migration-job.yaml
  - templates/deployment.yaml
set:
  existingSecret:
    name: solobill-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
    databaseUser: solobill_app
tests:
  - it: fails the render when migrationJob.databaseUser is left unset
    template: templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: >-
            migrationJob.databaseUser is required when migrationJob.enabled is true: this
            chart's default is a role distinct from config.databaseUser that runs
            db/migrations and owns the tables it creates, so the application role never can.
            Provision that role (able to connect and run CREATE TABLE/CREATE TRIGGER against
            this database) and set migrationJob.databaseUser to its name; see README.md's "One
            role, or two" section for exactly what config.databaseUser then needs granted
            instead.

  - it: fails the render when migrationJob.databaseUser equals config.databaseUser
    template: templates/deployment.yaml
    set:
      migrationJob:
        databaseUser: solobill_app
    asserts:
      - failedTemplate:
          errorMessage: >-
            migrationJob.databaseUser must not equal config.databaseUser: authenticating the
            migration Job and the Deployment as the same role recreates the single-role
            ownership gap this chart's default two-role split exists to close. Set
            migrationJob.databaseUser to a separate role that owns db/migrations' tables; see
            README.md's "One role, or two" section.

  - it: does not require migrationJob.databaseUser when migrationJob.enabled is false
    template: templates/deployment.yaml
    set:
      migrationJob:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            value: solobill_app

  - it: authenticates as migrationJob.databaseUser and its own secret key once both are set
    template: templates/migration-job.yaml
    set:
      migrationJob:
        databaseUser: solobill_migrator
      existingSecret:
        migrationDatabasePasswordKey: MIGRATION_DATABASE_PASSWORD
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            value: solobill_migrator
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: solobill-secrets
                key: MIGRATION_DATABASE_PASSWORD
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            value: solobill_app

  - it: leaves the Deployment's own database env untouched when migrationJob.databaseUser is set
    template: templates/deployment.yaml
    set:
      migrationJob:
        databaseUser: solobill_migrator
      existingSecret:
        migrationDatabasePasswordKey: MIGRATION_DATABASE_PASSWORD
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            value: solobill_app
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: solobill-secrets
                key: DATABASE_PASSWORD

  - it: falls back to databasePasswordKey when migrationJob.databaseUser is set but migrationDatabasePasswordKey is not
    template: templates/migration-job.yaml
    set:
      migrationJob:
        databaseUser: solobill_migrator
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            value: solobill_migrator
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: solobill-secrets
                key: DATABASE_PASSWORD
