suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
set:
  existingSecret:
    name: solobill-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
    databaseUser: solobill_app
  migrationJob:
    databaseUser: solobill_migrator
tests:
  - it: renders by default, since networkPolicy.enabled defaults to true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy

  - it: renders nothing when networkPolicy.enabled is false
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: selects this chart's own pods through the shared selectorLabels helper
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: solobill
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  # A hardcoded label would still match the default name, so the override is
  # what proves the selector comes from the shared helper rather than a literal.
  - it: follows a non-default nameOverride in the pod selector
    set:
      nameOverride: custom-billing
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: custom-billing

  - it: governs both ingress and egress by default
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress

  # ---------------------------------------------------------------------
  # Ingress
  # ---------------------------------------------------------------------
  - it: admits the public port from any source by default, with no from block at all
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080
      - isNull:
          path: spec.ingress[0].from

  - it: follows a non-default service.port for the public ingress rule, proving it is not hardcoded
    set:
      service:
        port: 9090
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9090

  # This is the acceptance criterion of the issue this policy answers: with the
  # policy enforced and no admin scope configured, no rule admits adminPort, so
  # a pod not matching the selector cannot reach it. Asserting the rule count
  # alone would pass with a second rule for a different port, so the port is
  # asserted absent by name as well.
  - it: admits the admin port from nothing by default, rendering no rule for it
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - notExists:
          path: spec.ingress[1]
      - equal:
          path: spec.ingress[0].ports
          value:
            - protocol: TCP
              port: 8080

  - it: admits the admin port once networkPolicy.ingress.admin scopes a peer
    set:
      networkPolicy:
        ingress:
          admin:
            namespaceSelector:
              kubernetes.io/metadata.name: monitoring
            podSelector:
              app.kubernetes.io/name: prometheus
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 8081
      # One peer carrying both selectors, so they are ANDed: a Prometheus pod
      # in the monitoring namespace, not either of the two on its own.
      - lengthEqual:
          path: spec.ingress[1].from
          count: 1
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: monitoring
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: prometheus

  - it: follows a non-default adminPort for the admin ingress rule, proving it is not hardcoded
    set:
      adminPort: 9091
      networkPolicy:
        ingress:
          admin:
            podSelector:
              app.kubernetes.io/name: prometheus
    asserts:
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9091

  # An ipBlock peer cannot share a list item with a selector: the NetworkPolicy
  # API rejects that. Two items is an OR, which is what this renders and what
  # the values comment promises.
  - it: renders an admin ipBlock as its own peer, ORed with the selector peer
    set:
      networkPolicy:
        ingress:
          admin:
            podSelector:
              app.kubernetes.io/name: prometheus
            ipBlock:
              cidr: 10.0.0.0/24
              except:
                - 10.0.0.5/32
    asserts:
      - lengthEqual:
          path: spec.ingress[1].from
          count: 2
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: prometheus
      - equal:
          path: spec.ingress[1].from[1].ipBlock.cidr
          value: 10.0.0.0/24
      - equal:
          path: spec.ingress[1].from[1].ipBlock.except
          value:
            - 10.0.0.5/32

  - it: omits an ipBlock peer whose cidr is left empty, rather than rendering an invalid one
    set:
      networkPolicy:
        ingress:
          admin:
            podSelector:
              app.kubernetes.io/name: prometheus
            ipBlock:
              except:
                - 10.0.0.5/32
    asserts:
      - lengthEqual:
          path: spec.ingress[1].from
          count: 1
      - notExists:
          path: spec.ingress[1].from[0].ipBlock

  - it: scopes the public port once networkPolicy.ingress.public names a peer
    set:
      networkPolicy:
        ingress:
          public:
            namespaceSelector:
              kubernetes.io/metadata.name: ingress-nginx
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx
      - isNull:
          path: spec.ingress[0].from[0].podSelector

  # ---------------------------------------------------------------------
  # Egress
  # ---------------------------------------------------------------------
  - it: allows exactly two egress rules by default, DNS and PostgreSQL
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2

  - it: drops the egress half entirely when networkPolicy.egress.enabled is false, keeping the ingress half
    set:
      networkPolicy:
        egress:
          enabled: false
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - isNull:
          path: spec.egress
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: allows DNS egress on UDP and TCP 53, scoped to kube-dns's own default namespace and pod label
    asserts:
      - equal:
          path: spec.egress[0].ports
          value:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns

  # Pins the merge behaviour the two replacement cases below exist for, rather
  # than leaving it assumed: an override under a key the default does not use is
  # added alongside the default, and matchLabels ANDs the two, so this selector
  # matches no pod carrying only one of them and DNS stays blocked. Were Helm to
  # replace the map instead, this case would fail and the nulls below would be
  # pointless rather than load-bearing.
  - it: keeps the default DNS podSelector key alongside an override under a different key
    set:
      networkPolicy:
        egress:
          dns:
            podSelector:
              app: custom-coredns
    asserts:
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels
          value:
            app: custom-coredns
            k8s-app: kube-dns

  # Helm merges a map override into the default key by key, and matchLabels ANDs
  # the result, so an override under a key the default does not use is added
  # alongside the default rather than replacing it. Asserting only that the new
  # key is present would pass while the default key silently survived, so the
  # default key is asserted absent too.
  - it: replaces the default DNS podSelector key when the override nulls it
    set:
      networkPolicy:
        egress:
          dns:
            podSelector:
              k8s-app: null
              app: custom-coredns
    asserts:
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["app"]
          value: custom-coredns
      - notExists:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]

  - it: replaces the default DNS namespaceSelector key when the override nulls it, the same per-key merge
    set:
      networkPolicy:
        egress:
          dns:
            namespaceSelector:
              kubernetes.io/metadata.name: null
              team: platform
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["team"]
          value: platform
      - notExists:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]

  - it: overrides the default DNS namespaceSelector under its own key without leaving the default behind
    set:
      networkPolicy:
        egress:
          dns:
            namespaceSelector:
              kubernetes.io/metadata.name: custom-dns
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: custom-dns

  - it: falls back to a port-only DNS rule when both selectors are set to null
    set:
      networkPolicy:
        egress:
          dns:
            namespaceSelector: null
            podSelector: null
    asserts:
      - isNull:
          path: spec.egress[0].to

  - it: allows PostgreSQL egress on its default port, with no destination restriction
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432
      - isNull:
          path: spec.egress[1].to

  - it: follows a non-default networkPolicy.egress.postgres.port, proving it is value-driven
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:6432/solobill?sslmode=require"
      networkPolicy:
        egress:
          postgres:
            port: 6432
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 6432

  - it: scopes PostgreSQL egress to an in-cluster database once its selectors are set
    set:
      networkPolicy:
        egress:
          postgres:
            namespaceSelector:
              kubernetes.io/metadata.name: postgres
            podSelector:
              cnpg.io/cluster: solobill
    asserts:
      - lengthEqual:
          path: spec.egress[1].to
          count: 1
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: postgres
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["cnpg.io/cluster"]
          value: solobill

  - it: scopes PostgreSQL egress to an off-cluster database through an ipBlock
    set:
      networkPolicy:
        egress:
          postgres:
            ipBlock:
              cidr: 203.0.113.7/32
    asserts:
      - lengthEqual:
          path: spec.egress[1].to
          count: 1
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 203.0.113.7/32

  - it: allows no identity provider egress while config.oidc.issuerUrl is empty
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2
      - notExists:
          path: spec.egress[2]

  - it: allows identity provider egress on HTTPS once OIDC is configured, with no destination restriction
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: https://idp.example.com/realms/solobill
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[2].ports[0].port
          value: 443
      - isNull:
          path: spec.egress[2].to

  - it: scopes identity provider egress to an in-cluster Keycloak on its own port
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: http://keycloak.identity.svc.cluster.local:8080/realms/solobill
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
      networkPolicy:
        egress:
          oidc:
            port: 8080
            namespaceSelector:
              kubernetes.io/metadata.name: identity
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8080
      - equal:
          path: spec.egress[2].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: identity

  # ---------------------------------------------------------------------
  # Render-time guards
  # ---------------------------------------------------------------------
  - it: fails the render when config.databaseUrl names a port the PostgreSQL egress rule does not allow
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:6432/solobill?sslmode=require"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names port 6432 but networkPolicy.egress.postgres.port is 5432:
            with networkPolicy.enabled and networkPolicy.egress.enabled both true, this policy
            would deny the one connection this application cannot start without. Set
            networkPolicy.egress.postgres.port to 6432, or point config.databaseUrl at port 5432.

  - it: fails the render when config.oidc.issuerUrl names a port the identity provider egress rule does not allow
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: http://keycloak.identity.svc.cluster.local:8080/realms/solobill
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl names port 8080 but networkPolicy.egress.oidc.port is 443: with
            networkPolicy.enabled and networkPolicy.egress.enabled both true, this policy would
            deny every OIDC discovery, token and JWKS call, so every OIDC login fails while the
            local login path keeps working. Set networkPolicy.egress.oidc.port to 8080, or point
            config.oidc.issuerUrl at port 443.

  # ---------------------------------------------------------------------
  # Port comparison is numeric, however either side is spelled (issue #42)
  # ---------------------------------------------------------------------
  # Both mismatch guards used to compare strings, so "05432" differed from
  # "5432" and the message told the operator to set the policy port to the
  # spelling the URL used. The two guards share a shape, so every case below
  # exists for both.
  - it: renders when config.databaseUrl names a leading-zero port equal to the PostgreSQL egress port
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:05432/solobill?sslmode=require"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432

  - it: renders when config.databaseUrl's port query parameter has a leading zero and matches the egress port
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc/solobill?sslmode=require&port=05432"
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432

  # The policy port reaches the template as an int64 from --set and as a
  # float64 or int from a values file, so the guard has to convert both sides
  # rather than compare them as they come.
  - it: renders when the PostgreSQL egress port is set and config.databaseUrl spells the same port with a leading zero
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:06432/solobill?sslmode=require"
      networkPolicy:
        egress:
          postgres:
            port: 6432
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 6432

  - it: renders when config.oidc.issuerUrl names a leading-zero port equal to the identity provider egress port
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com:00443/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.egress[2].ports[0].port
          value: 443

  - it: renders when config.oidc.issuerUrl's port query parameter has a leading zero and matches the egress port
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com/realms/solobill?port=00443"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 443

  - it: renders when the identity provider egress port is set and config.oidc.issuerUrl spells the same port with a leading zero
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "http://keycloak.identity.svc.cluster.local:08080/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
      networkPolicy:
        egress:
          oidc:
            port: 8080
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8080

  # Pins a documented limit rather than a feature: a policy port written with
  # a leading zero in a values file is read as octal by YAML 1.1, so 05432 is
  # 2842, and the schema accepts it as an integer. Operators write 5432.
  - it: reads an unquoted leading-zero networkPolicy.egress.postgres.port from a values file as octal
    values:
      - values/octal-policy-port.yaml
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:2842/solobill?sslmode=require"
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 2842

  # A real mismatch still fails, and the message names the numbers, not the
  # URL's spelling: "set the policy port to 06432" is the impossible advice
  # this issue is about.
  - it: fails a leading-zero config.databaseUrl port that differs numerically, naming both ports without the leading zero
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:06432/solobill?sslmode=require"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names port 6432 but networkPolicy.egress.postgres.port is 5432:
            with networkPolicy.enabled and networkPolicy.egress.enabled both true, this policy
            would deny the one connection this application cannot start without. Set
            networkPolicy.egress.postgres.port to 6432, or point config.databaseUrl at port 5432.

  - it: fails a leading-zero config.oidc.issuerUrl port that differs numerically, naming both ports without the leading zero
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "http://keycloak.identity.svc.cluster.local:08080/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl names port 8080 but networkPolicy.egress.oidc.port is 443: with
            networkPolicy.enabled and networkPolicy.egress.enabled both true, this policy would
            deny every OIDC discovery, token and JWKS call, so every OIDC login fails while the
            local login path keeps working. Set networkPolicy.egress.oidc.port to 8080, or point
            config.oidc.issuerUrl at port 443.

  # ---------------------------------------------------------------------
  # A URL's port outside 1 to 65535 fails on its own guard (issue #42)
  # ---------------------------------------------------------------------
  # Digits only is not enough: 0 and 65536 are digits. They used to reach the
  # mismatch guard, which then told the operator to set a policy port the
  # schema refuses. The message names the key only: no URL, no value.
  - it: renders when config.databaseUrl names port 1 and the PostgreSQL egress port is 1
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:1/solobill?sslmode=require"
      networkPolicy:
        egress:
          postgres:
            port: 1
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 1

  - it: renders when config.databaseUrl names port 65535 and the PostgreSQL egress port is 65535
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:65535/solobill?sslmode=require"
      networkPolicy:
        egress:
          postgres:
            port: 65535
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 65535

  - it: fails the render when config.databaseUrl names port 0
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:0/solobill?sslmode=require"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names a port outside 1 to 65535: a URL's port must be a number
            from 1 to 65535. Fix the port after the host's ":" or in the "port" query parameter,
            or remove it so this chart falls back to the scheme's own default port.

  - it: fails the render when config.databaseUrl names port 65536
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:65536/solobill?sslmode=require"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names a port outside 1 to 65535: a URL's port must be a number
            from 1 to 65535. Fix the port after the host's ":" or in the "port" query parameter,
            or remove it so this chart falls back to the scheme's own default port.

  # Digits that overflow an int must land on the same guard, not wrap into range.
  - it: fails the render when config.databaseUrl's port query parameter is a number too large for an integer
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc/solobill?sslmode=require&port=99999999999999999999"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names a port outside 1 to 65535: a URL's port must be a number
            from 1 to 65535. Fix the port after the host's ":" or in the "port" query parameter,
            or remove it so this chart falls back to the scheme's own default port.

  - it: renders when config.oidc.issuerUrl names port 1 and the identity provider egress port is 1
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com:1/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
      networkPolicy:
        egress:
          oidc:
            port: 1
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 1

  - it: renders when config.oidc.issuerUrl names port 65535 and the identity provider egress port is 65535
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com:65535/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
      networkPolicy:
        egress:
          oidc:
            port: 65535
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 65535

  - it: fails the render when config.oidc.issuerUrl names port 0
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com:0/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl names a port outside 1 to 65535: a URL's port must be a number
            from 1 to 65535. Fix the port after the host's ":" or in the "port" query parameter,
            or remove it so this chart falls back to the scheme's own default port.

  - it: fails the render when config.oidc.issuerUrl names port 65536
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com:65536/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl names a port outside 1 to 65535: a URL's port must be a number
            from 1 to 65535. Fix the port after the host's ":" or in the "port" query parameter,
            or remove it so this chart falls back to the scheme's own default port.

  # The guard above only fires for a URL whose port this chart can read. A
  # scheme with no known default port yields none, and the render goes ahead
  # rather than guessing: stated as a test so the behaviour is deliberate.
  - it: renders without a port guard for a database URL whose scheme names no port
    set:
      config:
        databaseUrl: "unix:///var/run/postgresql/.s.PGSQL.5432"
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432

  - it: fails the render when networkPolicy.egress.postgres.port is nulled while the egress half is on
    set:
      networkPolicy:
        egress:
          postgres:
            port: null
    asserts:
      - failedTemplate:
          errorMessage: >-
            networkPolicy.egress.postgres.port is required while networkPolicy.egress.enabled is
            true: it is the only port this policy allows PostgreSQL egress on.

  - it: fails the render when networkPolicy.egress.oidc.port is nulled while the egress half is on
    set:
      networkPolicy:
        egress:
          oidc:
            port: null
    asserts:
      - failedTemplate:
          errorMessage: >-
            networkPolicy.egress.oidc.port is required while networkPolicy.egress.enabled is
            true: it is the only port this policy allows identity provider egress on.

  - it: fails the render when service.port and adminPort are equal
    set:
      service:
        port: 8081
    asserts:
      - failedTemplate:
          errorMessage: >-
            service.port and adminPort are both 8081: the public ingress rule above admits
            any source on that port by default, so adminPort would be reachable from
            anywhere regardless of networkPolicy.ingress.admin. Set service.port and
            adminPort to different values.

  - it: fails the render when adminPort is changed to match the default service.port
    set:
      adminPort: 8080
    asserts:
      - failedTemplate:
          errorMessage: >-
            service.port and adminPort are both 8080: the public ingress rule above admits
            any source on that port by default, so adminPort would be reachable from
            anywhere regardless of networkPolicy.ingress.admin. Set service.port and
            adminPort to different values.

  # config.databaseUrl's host carries no port, so the pre-fix helper fell back
  # to postgres's own 5432 default and missed the mismatch entirely: the
  # query parameter is what actually determines the port pgx connects on.
  # This is the false negative the guard above would have let through before
  # solobill.urlPort learned to read it.
  - it: fails the render when config.databaseUrl's port query parameter disagrees with networkPolicy.egress.postgres.port
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc/solobill?sslmode=require&port=6432"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names port 6432 but networkPolicy.egress.postgres.port is
            5432: with networkPolicy.enabled and networkPolicy.egress.enabled both true,
            this policy would deny the one connection this application cannot start
            without. Set networkPolicy.egress.postgres.port to 6432, or point
            config.databaseUrl at port 5432.

  # A port query parameter overrides an explicit host-embedded port too, not
  # just a missing one: pgx applies it last, regardless of what the host
  # already carried. Proven here by matching the rule's port against the
  # query value rather than the host value, which would fail this same case
  # if the override were not honoured.
  - it: follows config.databaseUrl's port query parameter over its own host-embedded port
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require&port=6432"
      networkPolicy:
        egress:
          postgres:
            port: 6432
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.egress[1].ports[0].port
          value: 6432

  # Before this guard, a non-numeric port query parameter still failed the
  # render, but through the port-mismatch guard above, whose message is
  # built for a numeric mismatch and read as nonsense: "set
  # networkPolicy.egress.postgres.port to abc".
  - it: fails the render when config.databaseUrl's port query parameter is not a number
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc/solobill?sslmode=require&port=abc"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its "port" query
            parameter: a URL's port must be digits only. Fix or remove that query
            parameter.

  # A value that starts with digits must still fail: this pins the anchored
  # ^[0-9]+$ check against a weaker unanchored [0-9] one.
  - it: fails the render when config.databaseUrl's port query parameter mixes digits and letters
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc/solobill?sslmode=require&port=5432abc"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its "port" query
            parameter: a URL's port must be digits only. Fix or remove that query
            parameter.

  # The URL carries a password. The exact match proves the message holds
  # neither the password nor any other part of the URL.
  - it: keeps the userinfo out of the port query parameter error
    set:
      config:
        databaseUrl: "postgres://solobill:S3cretPw@postgres.example.svc/solobill?port=x1"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its "port" query
            parameter: a URL's port must be digits only. Fix or remove that query
            parameter.

  - it: keeps the userinfo out of the host part error
    set:
      config:
        databaseUrl: "postgres://solobill:S3cretPw@postgres.example.svc:5432abc/solobill"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its host part: a URL's
            port must be digits only. Fix the port after the host's ":", or remove
            it so this chart falls back to the scheme's own default port.

  - it: fails the render when config.databaseUrl's host-embedded port mixes digits and letters
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:5432abc/solobill?sslmode=require"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its host part: a URL's
            port must be digits only. Fix the port after the host's ":", or remove
            it so this chart falls back to the scheme's own default port.

  # Before this guard, a non-numeric host-embedded port crashed inside
  # urlParse (net/url.Parse) itself, aborting the whole render with a raw Go
  # template error ("invalid port ... after host") instead of a message this
  # chart authored.
  - it: fails the render when config.databaseUrl's host-embedded port is not a number
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:abc/solobill?sslmode=require"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its host part: a URL's
            port must be digits only. Fix the port after the host's ":", or remove
            it so this chart falls back to the scheme's own default port.

  # A URL that net/url rejects aborts the render inside urlParse, and that
  # error prints the whole URL. solobill.urlPort rejects the three shapes
  # before urlParse, naming only the values key. The exact errorMessage
  # proves that no part of the URL, the fake token below included, is printed.
  - it: fails config.databaseUrl with a bad percent escape without printing it
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:5432/solobill?x=%zz"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: fails config.databaseUrl with a percent sign at the end without printing it
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:5432/solobill%4"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: fails config.databaseUrl with a space in the host without printing it
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@post gres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: fails config.databaseUrl with a control character without printing it
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:5432/solobill\u0001"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: accepts a valid percent escape in config.databaseUrl
    set:
      config:
        databaseUrl: "postgres://u:p%40ss@postgres.example.svc:5432/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: reads the port of a config.databaseUrl that carries user info
    set:
      config:
        databaseUrl: "postgres://u:p@host:5432/db?sslmode=disable"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432

  - it: fails on the port of a config.databaseUrl that carries user info, proving the port is read
    set:
      config:
        databaseUrl: "postgres://u:p@host:6432/db?sslmode=disable"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names port 6432 but networkPolicy.egress.postgres.port is
            5432: with networkPolicy.enabled and networkPolicy.egress.enabled both true,
            this policy would deny the one connection this application cannot start
            without. Set networkPolicy.egress.postgres.port to 6432, or point
            config.databaseUrl at port 5432.

  - it: fails config.oidc.issuerUrl with a bad percent escape without printing it
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://u:s3cr3tTOKEN@idp.example.com/realms/%zz"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: fails config.oidc.issuerUrl with a space in the host without printing it
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://u:s3cr3tTOKEN@idp .example.com/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: fails config.oidc.issuerUrl with a control character without printing it
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://u:s3cr3tTOKEN@idp.example.com/realms/solobill\u0001"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  # solobill.urlPort is the same helper for config.oidc.issuerUrl as it is for
  # config.databaseUrl above: a change that broke the guard for one path and
  # not the other would otherwise go unnoticed, since the two tests above only
  # ever exercise the database URL.
  - it: fails the render when config.oidc.issuerUrl's port query parameter is not a number
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com/realms/solobill?port=abc"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl has a non-numeric port in its "port" query
            parameter: a URL's port must be digits only. Fix or remove that query
            parameter.

  - it: fails the render when config.oidc.issuerUrl's host-embedded port is not a number
    set:
      existingSecret:
        oidcClientSecretKey: OIDC_CLIENT_SECRET
      config:
        oidc:
          issuerUrl: "https://idp.example.com:abc/realms/solobill"
          clientId: solobill
          redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
          defaultTenantSlug: acme
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.oidc.issuerUrl has a non-numeric port in its host part: a URL's
            port must be digits only. Fix the port after the host's ":", or remove
            it so this chart falls back to the scheme's own default port.
