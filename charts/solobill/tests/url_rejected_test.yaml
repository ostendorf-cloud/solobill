suite: URLs that net/url rejects fail with the values key only
# solobill.urlPort checks the raw URL against an allowlist before sprig's urlParse, which
# prints the whole URL when net/url rejects it. Every case carries the fake token
# s3cr3tTOKEN, and the exact errorMessage proves the text holds no part of the URL.
# The DEL character (U+007F) cannot be written in a values file here, because the YAML
# library refuses to carry it: scripts/validate-chart.sh has that case.
templates:
  - templates/networkpolicy.yaml
set:
  existingSecret:
    name: solobill-secrets
    oidcClientSecretKey: OIDC_CLIENT_SECRET
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
    databaseUser: solobill_app
    oidc:
      clientId: solobill
      redirectUrl: https://solobill.example.com/api/v1/auth/oidc/callback
      defaultTenantSlug: acme
  migrationJob:
    databaseUser: solobill_migrator
tests:
  - it: config.databaseUrl rejects a caret
    set:
      config:
        databaseUrl: "postgres://u:s3cr^3tTOKEN@postgres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: &dbMessage >-
            config.databaseUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: config.databaseUrl rejects a brace
    set:
      config:
        databaseUrl: "postgres://u:s3cr{3tTOKEN@postgres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a pipe
    set:
      config:
        databaseUrl: "postgres://u:s3cr|3tTOKEN@postgres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects an angle bracket
    set:
      config:
        databaseUrl: "postgres://u:s3cr<3tTOKEN@postgres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a double quote
    set:
      config:
        databaseUrl: "postgres://u:s3cr\"3tTOKEN@postgres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a backtick
    set:
      config:
        databaseUrl: "postgres://u:s3cr`3tTOKEN@postgres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a caret in the host
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@post^gres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects an unclosed bracket
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@[::1:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a bracket in the user info
    set:
      config:
        databaseUrl: "postgres://u:s3cr[3tTOKEN@postgres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a percent escape in the host
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@post%41gres.example.svc:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a missing scheme
    set:
      config:
        databaseUrl: ":s3cr3tTOKEN"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a bracketed host that is not an IP literal
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@[postgres]:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.oidc.issuerUrl rejects a caret
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr^3tTOKEN@idp.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: &issuerMessage >-
            config.oidc.issuerUrl is not a valid URL: it holds a character or shape a
            URL may not have: whitespace, a control character, a percent sign not
            followed by two hex digits, a non-ASCII character, one of ^ { } | < > `
            the double quote or the backslash, a misplaced bracket, a percent escape
            in the host or a missing scheme. Fix it. The value is not printed here
            because a URL may carry a password.

  - it: config.oidc.issuerUrl rejects a brace
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr{3tTOKEN@idp.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.oidc.issuerUrl rejects a pipe
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr|3tTOKEN@idp.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.oidc.issuerUrl rejects an angle bracket
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr<3tTOKEN@idp.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.oidc.issuerUrl rejects a double quote
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr\"3tTOKEN@idp.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.oidc.issuerUrl rejects a backtick
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr`3tTOKEN@idp.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.oidc.issuerUrl rejects an unclosed bracket
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr3tTOKEN@[::1:443/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.oidc.issuerUrl rejects a missing scheme
    set:
      config:
        oidc:
          issuerUrl: ":s3cr3tTOKEN"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: accepts a percent-encoded password in config.databaseUrl
    set:
      config:
        databaseUrl: "postgres://u:p%40ss%2F@postgres.example.svc:5432/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts an IPv6 literal host in config.databaseUrl and reads its port
    set:
      config:
        databaseUrl: "postgres://u:p@[::1]:5432/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts a percent-encoded query value in config.databaseUrl
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:5432/solobill?search_path=a%2Fb"
    asserts:
      - hasDocuments:
          count: 1

  # The guards on one URL run in a fixed order and each one aborts the render, so only the
  # first one that applies speaks: the allowlist, the non-numeric host port, urlParse, the
  # non-numeric query port, the port range, then the mismatch with the policy port. Each
  # URL below breaks that guard and every one after it.
  - it: names the allowlist before any port guard
    set:
      config:
        databaseUrl: "postgres://u:s3cr^3tTOKEN@postgres.example.svc:abc/solobill?port=xyz"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: names the non-numeric host port before the query port
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:abc/solobill?port=xyz"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its host part: a URL's
            port must be digits only. Fix the port after the host's ":", or remove
            it so this chart falls back to the scheme's own default port.

  - it: names the non-numeric query port before the range
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:70000/solobill?port=xyz"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its "port" query
            parameter: a URL's port must be digits only. Fix or remove that query
            parameter.

  - it: names the range before the mismatch
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:5432/solobill?port=70000"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names a port outside 1 to 65535: a URL's port must be a number
            from 1 to 65535. Fix the port after the host's ":" or in the "port" query parameter,
            or remove it so this chart falls back to the scheme's own default port.

  - it: names the mismatch last
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:5432/solobill?port=6432"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names port 6432 but networkPolicy.egress.postgres.port is
            5432: with networkPolicy.enabled and networkPolicy.egress.enabled both true,
            this policy would deny the one connection this application cannot start
            without. Set networkPolicy.egress.postgres.port to 6432, or point
            config.databaseUrl at port 5432.

  # net/url takes the port of an http or https URL from the first colon of the host, so a
  # second colon in the host aborted urlParse and printed the URL. The helper takes the
  # host port after the first colon as well.
  - it: config.oidc.issuerUrl rejects an unbracketed IPv6 host as a bad host port
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr3tTOKEN@::1/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: &issuerHostPort >-
            config.oidc.issuerUrl has a non-numeric port in its host part: a URL's
            port must be digits only. Fix the port after the host's ":", or remove
            it so this chart falls back to the scheme's own default port.

  - it: config.oidc.issuerUrl rejects a second colon in the host
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr3tTOKEN@idp:x.example.com:443/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerHostPort

  - it: config.oidc.issuerUrl rejects a second colon in the port
    set:
      config:
        oidc:
          issuerUrl: "https://u:s3cr3tTOKEN@idp.example.com:44:3/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerHostPort

  - it: config.databaseUrl rejects a second colon in the host
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@postgres.example.svc:5432:6/solobill"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl has a non-numeric port in its host part: a URL's
            port must be digits only. Fix the port after the host's ":", or remove
            it so this chart falls back to the scheme's own default port.

  # A scheme-relative URL ("//host") has no scheme, so it is no usable URL for this chart,
  # and urlParse would read its authority without the checks above.
  - it: config.databaseUrl rejects a scheme-relative URL with a bad port
    set:
      config:
        databaseUrl: "//u:s3cr3tTOKEN@postgres.example.svc:abc/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects a scheme-relative URL with a bad IPv6 literal
    set:
      config:
        databaseUrl: "//u:s3cr3tTOKEN@[::1::2]/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.oidc.issuerUrl rejects a scheme-relative URL with a bracket in the user info
    set:
      config:
        oidc:
          issuerUrl: "//u:s3cr3t[TOKEN@idp.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.oidc.issuerUrl rejects a scheme-relative URL with a percent escape in the host
    set:
      config:
        oidc:
          issuerUrl: "//u:s3cr3tTOKEN@idp%41.example.com/realms/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *issuerMessage

  - it: config.databaseUrl rejects a malformed IPv6 literal
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@[1:2:3:4:5:6:7:8:9]:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl rejects an IPv6 literal with a bad IPv4 tail
    set:
      config:
        databaseUrl: "postgres://u:s3cr3tTOKEN@[::ffff:1.2.3.256]:5432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: *dbMessage

  - it: config.databaseUrl accepts an IPv6 literal with a documentation prefix
    set:
      config:
        databaseUrl: "postgres://u:p@[2001:db8::1]:5432/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: config.databaseUrl accepts an IPv4 mapped IPv6 literal
    set:
      config:
        databaseUrl: "postgres://u:p@[::ffff:1.2.3.4]:5432/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: config.databaseUrl accepts an IPv6 literal with a zone
    set:
      config:
        databaseUrl: "postgres://u:p@[fe80::1%25eth0]:5432/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: config.databaseUrl accepts a plain host and port
    set:
      config:
        databaseUrl: "postgres://u:p@postgres.example.svc:5432/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: config.oidc.issuerUrl accepts an IPv6 literal with a port
    set:
      config:
        oidc:
          issuerUrl: "https://[2001:db8::1]:443/realms/solobill"
    asserts:
      - hasDocuments:
          count: 1

  - it: reads the port of an IPv6 literal with a bad port as a port error
    set:
      config:
        databaseUrl: "postgres://u:p@[::1]:6432/solobill"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.databaseUrl names port 6432 but networkPolicy.egress.postgres.port is
            5432: with networkPolicy.enabled and networkPolicy.egress.enabled both true,
            this policy would deny the one connection this application cannot start
            without. Set networkPolicy.egress.postgres.port to 6432, or point
            config.databaseUrl at port 5432.
