suite: Object store environment of the Deployment
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: solobill-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
    databaseUser: solobill_app
  migrationJob:
    databaseUser: solobill_migrator
tests:
  - it: renders only the two requirement flags without an endpoint
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_REQUIRE_VERSIONING
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_OBJECT_LOCK
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
          any: true

  - it: renders the store and reads the key pair from the shared Secret
    set:
      objectStore:
        endpoint: "http://s3.seaweedfs.svc:8333"
        bucket: solobill
        objectLock: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
            value: "http://s3.seaweedfs.svc:8333"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_BUCKET
            value: solobill
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_USE_PATH_STYLE
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_OBJECT_LOCK
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: solobill-secrets
                key: S3_ACCESS_KEY_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: solobill-secrets
                key: S3_SECRET_ACCESS_KEY

  - it: reads the key pair from its own Secret when one is named
    set:
      objectStore:
        endpoint: "https://s3.example.com"
        bucket: solobill
        existingSecret:
          name: solobill-s3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: solobill-s3
                key: S3_SECRET_ACCESS_KEY

  - it: fails without a bucket when an endpoint is set
    set:
      objectStore:
        endpoint: "http://s3.seaweedfs.svc:8333"
    asserts:
      - failedTemplate:
          errorPattern: "objectStore.bucket is required"

  - it: refuses an endpoint with a path without printing it
    set:
      objectStore:
        endpoint: "http://s3.seaweedfs.svc:8333/solobill"
        bucket: solobill
    asserts:
      - failedTemplate:
          errorMessage: >-
            objectStore.endpoint must be an http or https URL with a host, scheme and
            host only: no user info, path, query or fragment. The value is not printed
            here because a URL may carry a password.

  - it: refuses an endpoint with user info without printing it
    set:
      objectStore:
        endpoint: "http://key:s3cr3tTOKEN@s3.seaweedfs.svc:8333"
        bucket: solobill
    asserts:
      - failedTemplate:
          errorMessage: >-
            objectStore.endpoint must be an http or https URL with a host, scheme and
            host only: no user info, path, query or fragment. The value is not printed
            here because a URL may carry a password.

  - it: refuses an endpoint with an uppercase scheme without printing it
    set:
      objectStore:
        endpoint: "HTTP://s3.seaweedfs.svc:8333"
        bucket: solobill
    asserts:
      - failedTemplate:
          errorMessage: >-
            objectStore.endpoint must be an http or https URL with a host, scheme and
            host only: no user info, path, query or fragment. The value is not printed
            here because a URL may carry a password.

  - it: refuses an endpoint with another scheme without printing it
    set:
      objectStore:
        endpoint: "ftp://s3.seaweedfs.svc"
        bucket: solobill
    asserts:
      - failedTemplate:
          errorMessage: >-
            objectStore.endpoint must be an http or https URL with a host, scheme and
            host only: no user info, path, query or fragment. The value is not printed
            here because a URL may carry a password.
