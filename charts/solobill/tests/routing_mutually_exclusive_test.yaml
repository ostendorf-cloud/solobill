suite: ingress and httpRoute are mutually exclusive
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: solobill-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
    databaseUser: solobill_app
    trustedProxies:
      - 10.0.0.0/8
  migrationJob:
    databaseUser: solobill_migrator
  ingress:
    enabled: true
  httpRoute:
    enabled: true
    parentRefs:
      name: shared-gateway
      namespace: gateway-system
tests:
  - it: fails the render when both ingress and httpRoute are enabled
    template: templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: >-
            ingress.enabled and httpRoute.enabled cannot both be true: pick one external
            route and turn the other off.
