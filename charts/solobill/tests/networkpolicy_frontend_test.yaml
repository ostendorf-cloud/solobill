suite: frontend NetworkPolicy
templates:
  - templates/networkpolicy-frontend.yaml
set:
  existingSecret:
    name: solobill-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
    databaseUser: solobill_app
  migrationJob:
    databaseUser: solobill_migrator
tests:
  - it: selects only the frontend pods
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: solobill-frontend
            app.kubernetes.io/instance: RELEASE-NAME

  - it: admits the public port and nothing else by default, and allows no egress at all
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress
          value:
            - ports:
                - protocol: TCP
                  port: 8080
      - equal:
          path: spec.egress
          value: []

  - it: admits the admin port only from networkPolicy.ingress.admin's peers
    set:
      networkPolicy:
        ingress:
          admin:
            namespaceSelector:
              kubernetes.io/metadata.name: monitoring
    asserts:
      - equal:
          path: spec.ingress[1]
          value:
            ports:
              - protocol: TCP
                port: 8081
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring

  - it: scopes the public port by networkPolicy.ingress.public, like the API's
    set:
      networkPolicy:
        ingress:
          public:
            namespaceSelector:
              kubernetes.io/metadata.name: ingress-nginx
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx

  - it: drops the egress half with networkPolicy.egress.enabled false
    set:
      networkPolicy:
        egress:
          enabled: false
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - notExists:
          path: spec.egress

  - it: renders nothing with networkPolicy.enabled false
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: fails the render when the public and the admin port are the same
    set:
      frontend:
        adminPort: 8080
    asserts:
      - failedTemplate:
          errorMessage: >-
            frontend.service.port and frontend.adminPort are both 8080: the public ingress rule
            admits any source on that port by default, so the admin port would be reachable
            from anywhere regardless of networkPolicy.ingress.admin. Set them to different
            values.
