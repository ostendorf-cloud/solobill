suite: ingress enabled
templates:
  - templates/ingress.yaml
  - templates/deployment.yaml
set:
  existingSecret:
    name: solobill-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
    databaseUser: solobill_app
    trustedProxies:
      - 10.0.0.0/8
  migrationJob:
    databaseUser: solobill_migrator
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: solobill.example.org
tests:
  - it: fails the render when ingress is enabled and config.trustedProxies is left empty
    template: templates/deployment.yaml
    set:
      config:
        databaseUrl: "postgres://postgres.example.svc:5432/solobill?sslmode=require"
        databaseUser: solobill_app
        trustedProxies: []
      migrationJob:
        databaseUser: solobill_migrator
    asserts:
      - failedTemplate:
          errorMessage: >-
            ingress.enabled is true but config.trustedProxies is empty: every client would
            share one rate-limit bucket keyed to the ingress controller's own address,
            collapsing per-client brute-force protection. Set config.trustedProxies to the
            ingress controller's pod/service CIDR.

  - it: renders fine and wires TRUSTED_PROXIES when ingress is enabled and it is set
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXIES
            value: "10.0.0.0/8"

  - it: renders exactly one Ingress
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress

  - it: uses the configured ingress class and host
    template: templates/ingress.yaml
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: solobill.example.org

  - it: routes /api to the API and everything else to the frontend, and nothing more
    template: templates/ingress.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths
          value:
            - path: /api
              pathType: Prefix
              backend:
                service:
                  name: RELEASE-NAME-solobill
                  port:
                    number: 8080
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: RELEASE-NAME-solobill-frontend
                  port:
                    number: 8080

  - it: points each path at the public port of its Service, never an admin port, even with non default ports
    template: templates/ingress.yaml
    set:
      service:
        port: 9090
      adminPort: 9091
      frontend:
        service:
          port: 7070
        adminPort: 7071
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9090
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.number
          value: 7070

  - it: gives every host the same two paths, so no host routes /api elsewhere or reaches an admin port
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        className: nginx
        hosts:
          - host: solobill.example.org
          - host: app.example.org
    asserts:
      - equal:
          path: spec.rules[1].host
          value: app.example.org
      - equal:
          path: spec.rules[1].http.paths[0].path
          value: /api
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.name
          value: RELEASE-NAME-solobill
      - equal:
          path: spec.rules[1].http.paths[1].path
          value: /
      - equal:
          path: spec.rules[1].http.paths[1].backend.service.name
          value: RELEASE-NAME-solobill-frontend
      - notContains:
          path: spec.rules[1].http.paths
          content:
            path: /healthz
          any: true
      - notContains:
          path: spec.rules[1].http.paths
          content:
            path: /metrics
          any: true

  - it: refuses a host that still carries its own paths, the routing is fixed
    template: templates/ingress.yaml
    set:
      ingress:
        hosts:
          - host: solobill.example.org
            paths:
              - path: /metrics
                pathType: Exact
    asserts:
      - failedTemplate: {}
