# Default values for solobill.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ostendorf-cloud/solobill
  # Defaults to .Chart.AppVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # No RBAC is created: this application makes no Kubernetes API calls of its own.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Matches the Dockerfile's distroless "nonroot" base image, uid/gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is safe here: cmd/solobill keeps its session store in
# memory (session.NewMemoryStore) and writes nothing to disk at runtime, the
# database connection and any OIDC/TLS calls are all over the network, and the
# distroless base image needs no writable path of its own either. Verified by
# reading cmd/solobill/main.go; there is no local file write in the request
# path this chart's Deployment exercises.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Also used as the container port: must match the port encoded in
  # config.listenAddr (default ":8080" for both). No probe targets this
  # port any more; see adminPort below and templates/deployment.yaml.
  port: 8080

# The second, administrative container port cmd/solobill listens on
# through govue's httpserver.RunAdmin: /metrics, /healthz and /readyz live
# here, nowhere on service.port. Must match the port encoded in
# config.adminListenAddr (default ":8081" for both).
#
# Exposed on the Service as its own named port; see templates/service.yaml's
# own comment and README.md's "Metrics and probes live on their own port"
# section for why. templates/ingress.yaml still only ever
# references service.port, never this one, so an external caller still
# cannot reach it through the Ingress. A pod IP is routable from anywhere in
# the cluster regardless of whether this port sits on the Service, so
# leaving it off the Service narrowed one convenient path, not the actual
# one; what closes that off for real is networkPolicy below.
adminPort: 8081

# A NetworkPolicy over this chart's own pods: who may reach them, and what
# they may reach.
#
# ------------------------------------------------------------------
# This object does nothing unless the CNI enforces NetworkPolicy
# ------------------------------------------------------------------
# A cluster whose network plugin does not implement NetworkPolicy accepts and
# stores this object with no error and no warning, and enforces none of it.
# The Kubernetes documentation is explicit: "Creating a NetworkPolicy resource
# without a controller that implements it will have no effect." Confirm your
# own CNI enforces NetworkPolicy before treating anything below as a boundary;
# see README.md's "NetworkPolicy" section.
networkPolicy:
  # On by default. The admin port (adminPort above) carries /metrics, /healthz
  # and /readyz and is reachable from any pod in the cluster without this, on
  # the pod IP whether or not the Service exposes it, so an install that does
  # not opt in is an install with no boundary at all. The cost of that default
  # is the inverse of the warning above: on a cluster that does not enforce
  # NetworkPolicy, this renders an object that reads like protection and
  # provides none.
  enabled: true
  ingress:
    # Scopes who may reach service.port. Empty, the default, admits any
    # source on that port: traffic arrives from an ingress controller or a
    # Gateway in a cluster-owned namespace this chart cannot name in advance,
    # and a public port that admits nothing is a broken install. Set
    # namespaceSelector/podSelector (ANDed, one peer) or ipBlock (its own
    # peer, ORed with them) to narrow it to your own ingress controller; see
    # templates/_helpers.tpl's solobill.networkPolicy.peers for the AND/OR
    # shape and README.md for a worked example.
    public:
      namespaceSelector: {}
      podSelector: {}
      ipBlock: {}
    # Scopes who may reach adminPort. Empty, the default, admits NOTHING: no
    # ingress rule for that port is rendered at all, so with the policy
    # enforced no pod can reach /metrics, /healthz or /readyz. This is the
    # opposite of public above, deliberately, and it is not expressible as an
    # empty rule: an ingress rule carrying ports and no "from" means "any
    # source" per the NetworkPolicy API, so the only way to deny a port is to
    # render no rule for it.
    #
    # Set this to the pods that legitimately scrape the admin port, for
    # example a Prometheus in its own namespace. Kubelet probe traffic needs
    # nothing here: it originates from the node, and node-to-pod traffic is
    # always allowed; see README.md for the evidence and the one case where
    # ipBlock is the escape hatch for it.
    admin:
      namespaceSelector: {}
      podSelector: {}
      ipBlock: {}
  egress:
    # Off switch for the egress half alone, separate from networkPolicy.enabled
    # above. The egress half is the half that breaks an installation rather
    # than exposing one: a rule whose port or destination does not match what
    # this application actually dials fails as a timeout at runtime. Turning
    # this off drops the Egress policyType and every rule below while keeping
    # the admin-port isolation, which is the point of this policy; turning the
    # whole policy off would give up both.
    enabled: true
    # Scopes the DNS egress rule's destination, on top of its port
    # restriction. Both selectors default to kube-dns's own conventional
    # namespace and pod label, which CoreDNS also carries on most clusters for
    # compatibility (kubeadm's default install included). Wrong on a cluster
    # whose DNS pods do not carry these labels: the pod then resolves no name
    # at all, so it reaches neither PostgreSQL nor the identity provider by
    # name, and it stays unready with an error naming the database rather than
    # DNS. Verify your cluster's actual DNS pod labels, for example with
    # `kubectl get pods -n kube-system -l k8s-app=kube-dns --show-labels`,
    # before relying on the default. A Service's own labels do not bind a
    # NetworkPolicy, which matches pods directly, and the two can disagree.
    # NodeLocal DNSCache is a second way this default misses: a cluster
    # running it points the pod's resolver at a per-node pod labelled
    # `k8s-app: node-local-dns`.
    #
    # Helm merges an override into this default map key by key, not key for
    # key: an override under a key the default does not already use is added
    # alongside the default, not instead of it, and matchLabels ANDs them.
    # `podSelector: {app: coredns}` here renders `app: coredns` AND
    # `k8s-app: kube-dns`, a selector matching no pod carrying only one of the
    # two, and DNS stays blocked. Null the specific default key you mean to
    # replace, for example `podSelector: {k8s-app: null, app: coredns}`. The
    # same applies to namespaceSelector's own `kubernetes.io/metadata.name`
    # key. Set a selector to null entirely (not {}: Helm merges a map default
    # with an empty override instead of clearing it, so {} silently keeps the
    # default) to drop it and leave the rule scoped by port alone.
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
    postgres:
      # The port this policy allows PostgreSQL egress on. Kept as its own
      # value rather than parsed out of config.databaseUrl, with
      # templates/networkpolicy.yaml's own guard failing the render when the
      # two disagree: what matters is that a mismatch cannot reach a cluster,
      # and an explicit port is readable without parsing a URL.
      port: 5432
      # Destination scope, on top of the port above. Empty, the default,
      # admits any destination on that port. No default could do better:
      # config.databaseUrl may name a managed PostgreSQL instance outside this
      # cluster entirely, which no namespace or pod selector can describe, and
      # a guessed namespace fails as a timeout. Scope an in-cluster database
      # with namespaceSelector/podSelector, an off-cluster one with ipBlock;
      # see README.md for both worked examples.
      namespaceSelector: {}
      podSelector: {}
      ipBlock: {}
    oidc:
      # The port this policy allows identity provider egress on, with the same
      # render-time guard against config.oidc.issuerUrl naming a different
      # one. An in-cluster Keycloak on plain HTTP behind the cluster's own TLS
      # needs this set to its own port, commonly 8080.
      port: 443
      # Destination scope, on top of the port above, with the same empty
      # default and the same reasoning as postgres above: an identity provider
      # is as often outside the cluster as in it. The whole rule is omitted
      # while config.oidc.issuerUrl is empty, so a default install with no
      # OIDC allows no outbound HTTPS at all.
      namespaceSelector: {}
      podSelector: {}
      ipBlock: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: solobill.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API alternative to ingress above. Mutually exclusive with it (see
# templates/deployment.yaml's own fail guard): an install never renders
# both for the same hostname. Off by default, same as ingress, so a
# default install renders no external route at all until one of the two
# is chosen.
#
# The HTTPRoute and Gateway kinds are Gateway API CRDs. This chart never
# ships them (see kubernetes-conventions) and never creates the Gateway
# itself: both the CRDs and a running Gateway with a listener that allows
# this release's namespace are prerequisites, provisioned once per cluster,
# not by this chart.
httpRoute:
  enabled: false
  # Hostnames this HTTPRoute matches, mirroring ingress.hosts' host field.
  # A Gateway listener's own hostname (and allowedRoutes) still decides
  # whether traffic for one of these actually reaches this HTTPRoute; see
  # kubernetes-conventions.
  hostnames: []
  annotations: {}
  # Routing is fixed to this chart's own Service on service.port: no
  # values-driven way to add a second backend or a per-path rule, the same
  # single-backend shape ingress.hosts already assumes. An HTTPRoute rule
  # with no "matches" defaults to a "/" prefix match per the Gateway API
  # spec, the same default an Ingress with one "/" path rule gives.
  parentRefs:
    # Name of the Gateway this HTTPRoute attaches to. Required when
    # httpRoute.enabled is true.
    name: ""
    # Namespace the Gateway lives in. Required when httpRoute.enabled is
    # true: a Gateway is usually platform owned and lives in a different
    # namespace than this release, and Gateway API's own parentRefs
    # defaults an unset namespace to the HTTPRoute's own namespace, which
    # is normally wrong here. The Gateway's own allowedRoutes still decides
    # whether this reference is actually honoured.
    namespace: ""
    # Optional: the specific listener to attach to, when the Gateway
    # exposes more than one, for example separate HTTP and HTTPS
    # listeners.
    sectionName: ""

resources:
  requests:
    # A govue HTTP server with one Postgres pool and no background polling:
    # light at idle, matching cve-notifier's own baseline request for a
    # comparably small Go service.
    cpu: 100m
    memory: 128Mi
  limits:
    # No CPU limit: request handling is bursty (one HTTP request at a time
    # per goroutine), and a CPU limit would only throttle the pod mid-request
    # for being briefly busy, not for being broken. A memory limit stays in
    # place as a safety net against a genuine leak.
    memory: 256Mi

# Disabled by default: db/migrations is applied by this chart's own
# migrationJob (a pre-install/pre-upgrade hook, see below) before this
# Deployment's pods are ever created or updated, so cmd/solobill's own
# startup never waits on a migration. Enable this only for a deployment that
# adds its own slow startup work in front of config.Load. Targets adminPort
# (/healthz) when enabled, the same as livenessProbe below.
startupProbe:
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

# Targets adminPort (/healthz), not service.port: see adminPort's own
# comment above for why these two probes, like the Prometheus scrape, live
# on the administrative listener instead.
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# Targets adminPort (/readyz); see livenessProbe's own comment above.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Plain, non-secret configuration, mapped 1:1 from internal/config.Config
# (see that package's own doc comment for the authoritative list). See
# README.md's values table for what each one does.
config:
  listenAddr: ":8080"
  # ADMIN_LISTEN_ADDR: the second listener /metrics, /healthz and /readyz
  # move to; see adminPort above for why it is not exposed on the Service.
  # Must match adminPort.
  adminListenAddr: ":8081"
  logLevel: "info"

  # --------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------
  # databaseUrl is deliberately plain, not secret: internal/config.Config's
  # own doc comment defines DatabaseURL as "the connection URL without
  # credentials: scheme, host, port, database name and query parameters
  # only", with databaseUser and the secret-only database password below
  # assembled into it by Config.DatabaseDSN. This is NOT the same contract
  # cve-notifier's own DATABASE_URL has: that field carries full
  # credentials (user:pass@host/db) and is therefore read only from
  # existingSecret there. solobill's own config package draws this
  # distinction on purpose (see internal/config.Config's DatabaseURL
  # field comment), so this chart follows solobill's contract, not
  # cve-notifier's.
  #
  # Required (internal/config.Load calls l.Required("DATABASE_URL")); no
  # usable default exists for a database this chart does not provision.
  # Example: "postgres://postgres.example.svc:5432/solobill?sslmode=require".
  databaseUrl: ""
  # databaseUser is plain too: a role name is not a credential by itself.
  # Required (l.Required("DATABASE_USER")).
  #
  # ------------------------------------------------------------------
  # The database role MUST be NOSUPERUSER and NOBYPASSRLS
  # ------------------------------------------------------------------
  # db/migrations enables FORCE ROW LEVEL SECURITY on accounts and
  # invites. FORCE makes the policy bind even the table's own owning
  # role, but a Postgres superuser (or any role with BYPASSRLS) is
  # exempt from row level security regardless of FORCE. If the role
  # named here has either property, every row-level-security policy
  # this application depends on for tenant isolation provides no actual
  # protection, silently.
  #
  # Unlike docker-compose.yaml's own local Postgres, which this chart's
  # cluster-operated Postgres is not: that compose file brings its own
  # throwaway database and therefore has to script a second, restricted
  # role itself (docker/postgres/init-app-role.sh), on top of a bootstrap
  # superuser used only to run migrations. This chart's Postgres "already
  # runs in the cluster" instead: the cluster operator who provisions the
  # database and this role is responsible for making it NOSUPERUSER
  # NOBYPASSRLS, not this chart, which has no way to enforce that from
  # here.
  #
  # This role must never be the one that runs db/migrations (via
  # migrationJob below), and must never own tenants, accounts, invites,
  # documents or document_lines: FORCE ROW LEVEL SECURITY binds every
  # ordinary application query this role runs regardless of ownership,
  # but PostgreSQL's own ALTER TABLE reference makes ownership, not
  # FORCE, what ALTER TABLE itself checks - an owning role could still
  # run ALTER TABLE ... NO FORCE ROW LEVEL SECURITY or drop a policy
  # outright, or disable documents'/document_lines' own immutability
  # triggers and then mutate or delete an issued invoice. This chart's
  # default is the two-role split that keeps that from being possible
  # (migrationJob.databaseUser, set to a role distinct from this one);
  # see migrationJob.databaseUser's own comment below and README.md's
  # "One role, or two" section for exactly what this role needs granted
  # instead of owning anything.
  databaseUser: ""
  # sessionAllowPlainHttp drops the Secure cookie attribute, matching
  # internal/config.Config's own SessionAllowPlainHTTP doc comment: "a
  # real deployment sits behind a TLS-terminating ingress and must leave
  # this false". Deliberately false here, NOT true: true is
  # docker-compose.yaml's own local-dev-only setting, for a plain-HTTP
  # localhost Compose network with no TLS-terminating ingress in front of
  # it. Never set this true behind a real ingress.
  sessionAllowPlainHttp: false

  # CORS allow-list. Empty, the default, is the common case where
  # cmd/solobill serves the built SPA itself (same-origin): no CORS
  # middleware is built at all. Set this only for a frontend served from
  # a different origin than this API.
  allowedOrigins: []
  # CIDRs whose X-Forwarded-For entry is trusted as the real client
  # address, for example the cluster's own ingress controller pod CIDR.
  # Empty, the default, trusts only the direct TCP peer (this Service),
  # which is correct with no ingress or proxy in front of the pod.
  trustedProxies: []

  # Token bucket applied to local login and invite accept.
  rateLimitBurst: 10
  rateLimitPer: "1m"

  # How long a freshly created invite stays redeemable when a
  # create-invite request does not specify one.
  inviteDefaultTtl: "168h"

  # --------------------------------------------------------------------
  # OIDC
  # --------------------------------------------------------------------
  # Optional as a whole, matching internal/config.Config's own
  # OIDCEnabled doc comment: OIDC is off exactly when issuerUrl is empty,
  # the same rule cmd/solobill applies to OIDC_ISSUER_URL itself. A
  # single sole trader's own tenant does not need an identity provider at
  # all. Once issuerUrl is set, clientId, redirectUrl and
  # defaultTenantSlug below, and existingSecret.oidcClientSecretKey, are
  # all required together: internal/config.Load fails the deployment
  # fast at startup if any one of the four is set without the others.
  oidc:
    issuerUrl: ""
    clientId: ""
    redirectUrl: ""
    # Defaults to govue oidc.DefaultScopes when empty. Add the scope a
    # Keycloak client mapper maps realm roles under (commonly "roles")
    # here if the identity provider needs it.
    scopes: []
    # The single tenant every OIDC login resolves to; see
    # internal/config.Load's own package doc section "Resolving a
    # tenant for OIDC" for why one configured tenant, not a
    # per-request one, is this milestone's only working answer.
    defaultTenantSlug: ""

# This chart never creates a Secret from plaintext values (see README.md).
# Every secret-shaped setting is read from a Secret the installer already
# has, named here and referenced key by key, so a secret-manager operator
# that produces different key names is never forced into one shape.
existingSecret:
  # Required: name of the existing Secret carrying every key below.
  name: ""
  # Required keys: DATABASE_PASSWORD, SESSION_CODEC_KEY and CSRF_KEY have
  # no fallback, so a missing key in the referenced Secret surfaces as a
  # real Kubernetes error (CreateContainerConfigError) instead of a
  # silently empty value.
  #
  # The role named by config.databaseUser MUST be NOSUPERUSER and
  # NOBYPASSRLS; see config.databaseUser's own comment above for the
  # full reasoning.
  databasePasswordKey: "DATABASE_PASSWORD"
  # Hex encoded, at least 32 bytes decoded (session.MinKeyBytes), for
  # example generated with "openssl rand -hex 32". Two different keys
  # for two different HMAC purposes; see internal/config.Config's own
  # SessionCodecKey/CSRFKey doc comment for why reusing one would be a
  # cryptographic smell this chart does not repeat.
  sessionCodecKeyKey: "SESSION_CODEC_KEY"
  csrfKeyKey: "CSRF_KEY"
  # Optional: left empty, OIDC_CLIENT_SECRET is omitted entirely rather
  # than wired to a key that may not exist. Required together with
  # config.oidc.issuerUrl/clientId/redirectUrl/defaultTenantSlug once
  # OIDC is actually configured.
  oidcClientSecretKey: ""
  # Password key for migrationJob.databaseUser, in this same Secret. Left
  # empty, the default, falls back to databasePasswordKey above (the
  # single-role case). Set this together with migrationJob.databaseUser
  # to use a separate password for the separate migration role; see
  # README.md's "One role, or two" section.
  migrationDatabasePasswordKey: ""

# A pre-install,pre-upgrade Helm hook Job that runs "dbmate up" against the
# same connection config.databaseUrl/databaseUser/existingSecret.name above
# configure, applying db/migrations (embedded into this chart as a
# ConfigMap, see templates/migration-configmap.yaml) before this chart's own
# Deployment is created or updated. pre-install,pre-upgrade, not just
# pre-install: an upgrade that adds a migration must not let the new image's
# pods start against the old schema. dbmate's own "up" command is
# idempotent (it tracks applied migrations in its own schema_migrations
# table), so re-running it against an already-migrated database on every
# upgrade is safe, not merely tolerated.
migrationJob:
  enabled: true
  # Required whenever migrationJob.enabled is true, with no usable
  # default: left empty here on purpose, the same reason
  # config.databaseUrl, config.databaseUser and existingSecret.name are.
  # This chart cannot create the role itself, so there is no value that
  # would make a fresh install work on its own; templates/deployment.yaml
  # fails the render with a readable message, naming what is missing,
  # when this is left unset or set equal to config.databaseUser, rather
  # than quietly falling back to it.
  #
  # Set this to a separate, higher-privileged role that OWNS the tables
  # db/migrations creates and applies them, distinct from
  # config.databaseUser (which the Deployment's pods connect as for
  # ordinary queries, and which must never own them; see that key's own
  # comment above). Mirrors docker-compose.yaml's own bootstrap-role-for-
  # migrations-only split, with one difference: that compose file's
  # bootstrap role is a full Postgres superuser, where this role only
  # ever needs to own the schema it creates, never to be a superuser or
  # carry BYPASSRLS. See README.md's "One role, or two" section for the
  # full reasoning, exactly what config.databaseUser needs granted
  # instead of ownership, and the caveats this chart cannot enforce from
  # here.
  databaseUser: ""
  image:
    # The same official dbmate image docker-compose.yaml already uses for
    # its own "migrate" service, pinned to the same tag
    # (docker-compose.yaml's own comment: "Pinned to 2.38.1, the latest
    # patch in the 2.38 line mise.toml already pins dbmate to").
    repository: ghcr.io/amacneil/dbmate
    tag: "2.38.1"
  annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
