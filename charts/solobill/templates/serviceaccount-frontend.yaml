{{/*
The frontend's own ServiceAccount. An ordinary resource, unlike the API's:
no hook runs under it, so it is created with the Deployment.
*/}}
{{- if .Values.frontend.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "solobill.frontend.serviceAccountName" . }}
  labels:
    {{- include "solobill.frontend.labels" . | nindent 4 }}
  {{- with .Values.frontend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The frontend makes no Kubernetes API calls, so no pod needs this token.
automountServiceAccountToken: false
{{- end -}}
