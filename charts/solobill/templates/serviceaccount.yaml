{{/*
A pre-install,pre-upgrade hook at weight -2, so Helm creates it before the
migration ConfigMap (weight -1) and the migration Job (weight 0): on a
fresh install, hooks are the only resources that exist while earlier hooks
of the same event are still running, so the migration Job's own
serviceAccountName would otherwise be rejected on admission (the
ServiceAccount, as an ordinary un-annotated resource, would only be
created after every pre-install hook, this Job included, has already
run). The delete policy is deliberately "before-hook-creation" alone, with
no "hook-succeeded": this ServiceAccount must survive after the hook
succeeds, since the Deployment needs it to still exist once the install or
upgrade finishes. "before-hook-creation" alone is what keeps this
idempotent across upgrades (Helm deletes any old copy right before
creating the new one) while leaving it in place the rest of the time.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "solobill.serviceAccountName" . }}
  labels:
    {{- include "solobill.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# This application makes no Kubernetes API calls of its own (see
# values.yaml's own comment on serviceAccount.create), so no pod needs
# this token mounted at all; every pod spec this chart renders also sets
# this explicitly, belt-and-suspenders, regardless of which
# ServiceAccount it names.
automountServiceAccountToken: false
{{- end -}}
