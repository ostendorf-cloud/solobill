apiVersion: v1
kind: Service
metadata:
  name: {{ include "solobill.frontend.fullname" . }}
  labels:
    {{- include "solobill.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # The admin listener, for a scrape inside the cluster. The Ingress and
    # the HTTPRoute only ever name the http port above.
    - port: {{ .Values.frontend.adminPort }}
      targetPort: admin
      protocol: TCP
      name: admin
  selector:
    {{- include "solobill.frontend.selectorLabels" . | nindent 4 }}
