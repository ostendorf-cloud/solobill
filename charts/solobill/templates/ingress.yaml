{{/*
The ingress/httpRoute mutual-exclusion guard lives in templates/deployment.yaml,
which always renders: see that file for why it is not duplicated here.

The routing is fixed, the same on every host: /api to the API, every other
path to the frontend, both on the public port of their Service, never the
admin port. pathType Prefix matches per path element: /api and /api/v1/me
go to the API, /apiary and /assets go to the frontend.
*/}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "solobill.fullname" . }}
  labels:
    {{- include "solobill.release.labels" . | nindent 4 }}
  {{- /* ingress.annotations win over the request limit hook of issue #82, see _requestlimits.tpl. */}}
  {{- with merge (deepCopy (.Values.ingress.annotations | default dict)) (fromYaml (include "solobill.requestLimits.annotations" .)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "solobill.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "solobill.frontend.fullname" $ }}
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
{{- end -}}
